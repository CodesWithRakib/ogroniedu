version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ogroni_staging_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ogroniedu_staging}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-ogroniedu_staging}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ogroni_staging_net

  redis:
    image: redis:7-alpine
    container_name: ogroni_staging_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - staging_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ogroni_staging_net

  api:
    image: ${API_IMAGE:-ogroniedu-api:latest}
    container_name: ogroni_staging_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ogroniedu_staging}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/api/health/liveness']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ogroni_staging_net

  web:
    image: ${WEB_IMAGE:-ogroniedu-web:latest}
    container_name: ogroni_staging_web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.staging.ogroniedu.com}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ogroni_staging_net

networks:
  ogroni_staging_net:
    driver: bridge

volumes:
  staging_pgdata:
  staging_redisdata:
