services:
  postgres:
    image: postgres:16-alpine
    container_name: ogroni_staging_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stagingpassword}
      POSTGRES_DB: ${DB_NAME:-ogroniedu_staging}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ogroniedu_staging}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ogroni_staging_net

  redis:
    image: redis:7-alpine
    container_name: ogroni_staging_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-stagingredis}
    volumes:
      - staging_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-stagingredis}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ogroni_staging_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-ogroniedu-api:latest}
    container_name: ogroni_staging_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-stagingpassword}
      DB_NAME: ${DB_NAME:-ogroniedu_staging}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-stagingredis}
      JWT_SECRET: ${JWT_SECRET:-staging-jwt-secret-not-for-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health/live']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ogroni_staging_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${WEB_IMAGE:-ogroniedu-web:latest}
    container_name: ogroni_staging_web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api:4000}
    ports:
      - '5000:5000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ogroni_staging_net

networks:
  ogroni_staging_net:
    driver: bridge

volumes:
  staging_pgdata:
  staging_redisdata:
