          stroke="#93c5fd"
          stroke-width="15"
          stroke-linecap="round"
          fill="none" />
    <circle cx="384" cy="323" r="18" fill="url(#sparkGradM)" />

    <!-- Golden Guidance Star / Spark -->
    <path d="M256 179 L269 202 L292 207 L274 223 L279 246 L256 233 L233 246 L238 223 L220 207 L243 202 Z"
