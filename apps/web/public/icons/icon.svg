<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0df5c4" />
      <stop offset="50%" stop-color="#00cba0" />
      <stop offset="100%" stop-color="#046b5a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0df5c4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#031317" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cardGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06252d" />
      <stop offset="100%" stop-color="#031317" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#cardGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#bgGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="url(#bgGrad)" filter="url(#glow)" opacity="0.35" />

  <!-- Central Mascot Shield Circle -->
  <circle cx="256" cy="256" r="160" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="150" fill="#042426" />

  <!-- Owl Mascot Icon (Scaled up for 512x512) -->
  <!-- Left Ear / Tuft -->
  <path d="M176 170 L140 110 L220 134" stroke="#0df5c4" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Right Ear / Tuft -->
  <path d="M336 170 L372 110 L292 134" stroke="#0df5c4" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Owl Head / Body Base -->
  <circle cx="256" cy="270" r="115" stroke="#0df5c4" stroke-width="18" fill="#03191d" />

  <!-- Glasses Frames -->
  <!-- Left Glass -->
  <circle cx="210" cy="255" r="42" stroke="#0df5c4" stroke-width="16" fill="#073b3e" />
  <!-- Right Glass -->
  <circle cx="302" cy="255" r="42" stroke="#0df5c4" stroke-width="16" fill="#073b3e" />
  <!-- Bridge -->
  <path d="M250 255 L262 255" stroke="#0df5c4" stroke-width="16" stroke-linecap="round" />

  <!-- Pupils -->
  <circle cx="210" cy="255" r="15" fill="#ffffff" />
  <circle cx="302" cy="255" r="15" fill="#ffffff" />
  <circle cx="214" cy="251" r="5" fill="#0df5c4" />
  <circle cx="306" cy="251" r="5" fill="#0df5c4" />

  <!-- Owl Beak -->
  <polygon points="256,290 240,320 272,320" fill="#0df5c4" stroke="#0df5c4" stroke-width="4" stroke-linejoin="round" />

  <!-- Graduation Cap Tassel Hint -->
  <path d="M256 120 L200 145 L256 170 L312 145 Z" fill="#0df5c4" />
  <path d="M256 120 L256 100" stroke="#0df5c4" stroke-width="8" stroke-linecap="round" />
  <path d="M312 145 L325 180" stroke="#0df5c4" stroke-width="6" stroke-linecap="round" />
</svg>
