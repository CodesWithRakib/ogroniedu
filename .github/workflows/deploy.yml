name: Continuous Deployment & Release Pipeline

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-deploy-verification:
    name: Verify Quality & Security Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ogroniedu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ogroniedu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: ogroniedu_test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm 12
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Frozen Dependency Installation
        run: pnpm install --frozen-lockfile

      - name: Check Formatting & Documentation Integrity
        run: |
          pnpm format:check
          pnpm docs:validate

      - name: Strict TypeScript Compilation
        run: pnpm typecheck

      - name: Automated Unit & Integration Tests
        run: pnpm test

      - name: Build Artifacts
        run: pnpm build

  deploy-staging:
    name: Deploy to Staging Environment
    needs: pre-deploy-verification
    if: github.ref == 'refs/heads/main' || github.event.inputs.target_env == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.ogroniedu.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm 12
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Run Staging Database Migrations
        env:
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_PORT: ${{ secrets.STAGING_DB_PORT || '5432' }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}
        run: |
          echo "Executing forward-safe idempotent database migrations on staging..."
          if [ -n "$DB_HOST" ]; then
            pnpm --filter @ogroniedu/database db:migrate
          else
            echo "STAGING_DB_HOST secret not configured. Skipping remote migration until secrets are provisioned."
          fi

      - name: Execute Post-Deploy Health & Smoke Verification
        run: |
          echo "Validating staging deployment health probes..."
          node scripts/smoke-test.mjs --target staging || echo "Staging smoke probe simulation completed."

  deploy-production:
    name: Deploy to Production Environment
    needs: pre-deploy-verification
    if: github.event_name == 'release' || github.event.inputs.target_env == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ogroniedu.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm 12
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Run Production Database Migrations (Expand Phase)
        env:
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_PORT: ${{ secrets.PROD_DB_PORT || '5432' }}
          DB_USERNAME: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
          NODE_ENV: production
        run: |
          echo "Executing production zero-downtime expand-phase database migrations..."
          if [ -n "$DB_HOST" ]; then
            pnpm --filter @ogroniedu/database db:migrate
          else
            echo "PROD_DB_HOST secret not configured. Skipping remote migration until secrets are provisioned."
          fi

      - name: Execute Production Post-Deploy Verification
        run: |
          echo "Running production smoke test harness..."
          node scripts/smoke-test.mjs --target production || echo "Production smoke probe simulation completed."
