name: Browser E2E

on:
  workflow_dispatch:
  schedule:
    # Nightly at 19:00 UTC (01:00 Asia/Dhaka), independent of pushes.
    - cron: '0 19 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/web/e2e/**'
      - 'apps/web/playwright.config.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright journeys on staging stack
    runs-on: ubuntu-latest
    env:
      DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      DB_NAME: ogroniedu_staging
      REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      FRONTEND_URL: http://localhost:5000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      E2E_BASE_URL: http://localhost:5000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm 12
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Frozen Dependency Installation
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm --filter @ogroniedu/web exec playwright install chromium --with-deps

      - name: Start staging stack
        run: docker compose -f docker-compose.staging.yml up --build -d

      - name: Migrate and seed staging database
        run: pnpm db:migrate && pnpm db:seed

      - name: Run browser journeys
        run: pnpm --filter @ogroniedu/web e2e
        env:
          E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
          E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
          E2E_TUTOR_EMAIL: ${{ secrets.E2E_TUTOR_EMAIL }}
          E2E_TUTOR_PASSWORD: ${{ secrets.E2E_TUTOR_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Assert seeded journeys ran (no silent skips)
        run: node scripts/check-e2e-skips.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

      - name: Tear down staging stack
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v
