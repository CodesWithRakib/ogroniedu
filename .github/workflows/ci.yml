name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ogroniedu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ogroniedu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: ogroniedu_test
      SSLCOMMERZ_STORE_ID: sandbox_ci_store
      SSLCOMMERZ_STORE_PASSWD: sandbox_ci_passwd
      SSLCOMMERZ_IS_LIVE: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm 12
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${ runner.os }-pnpm-store-

      - name: Frozen Dependency Installation
        run: pnpm install --frozen-lockfile

      - name: Check Code Formatting
        run: pnpm format:check

      - name: Validate Documentation Integrity
        run: pnpm docs:validate

      - name: Strict TypeScript Typecheck
        run: pnpm typecheck

      - name: Lint with Warnings Denied
        run: pnpm lint

      - name: Run Automated Test Suites
        run: pnpm test

      - name: Build Production Bundles
        run: pnpm build
